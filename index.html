<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Landing Page - Toko Online</title>
    <style>
        /* 1. Reset & Box Model */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        /* 2. Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a252f;
            color: white;
            padding: 15px 30px;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .navbar ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* 3. Hero Section */
        .hero {
            position: relative;
            background-color: #2980b9;
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .badge-promo {
            position: absolute;
            top: 10px;
            right: 15px;
            background-color: #e74c3c;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 4. Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .card p {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 2. Navbar -->
    <nav class="navbar">
        <div class="logo">Toko Online</div>
        <ul>
            <li><a href="#">Beranda</a></li>
            <li><a href="#">Produk</a></li>
            <li><a href="#">Kontak</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- 3. Hero Section -->
        <section class="hero">
            <div class="badge-promo">PROMO SPECIAL</div>
            <h1>Selamat Datang di Toko Kami</h1>
            <p>Dapatkan produk terbaik dengan harga terjangkau!</p>
        </section>

        <!-- 4. Gallery -->
        <section class="gallery">
            <div class="card">
                <img src="jersey timnas.jpeg" alt="Produk 1">
                <h3>Produk 1</h3>
                <p>Rp300.000</p>
            </div>
            <div class="card">
                <img src="jersey udinus.jpeg" alt="Produk 2">
                <h3>Produk 2</h3>
                <p>Rp150.000</p>
            </div>
            <div class="card">
                <img src="jersey paper rex.jpeg" alt="Produk 3">
                <h3>Produk 3</h3>
                <p>Rp400.000</p>
            </div>
        </section>
    </div>

</body>
</html>
